<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sidequest Home</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800;9..40,900&family=Inter:wght@600&display=swap">
<style>
/* Layout: one 428px phone column. Header map fades in from the top, then three reel sections. */
:root{
  --text-primary:#111214;
  --on-dark:#fff;
  --accent:#6b2bf5;
  --page:#ffffff;
  --desk:#e9eaee;
  --sans:"DM Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --display:"SF Pro Display", -apple-system, BlinkMacSystemFont, "DM Sans", system-ui, sans-serif;
}
*{box-sizing:border-box;margin:0}
html,body{background:var(--page);color:var(--text-primary);font-family:var(--sans);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body{overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
img,video{display:block}

.phone{position:relative;width:100%;max-width:428px;margin:0 auto;background:var(--page);overflow:hidden;padding-bottom:calc(130px + env(safe-area-inset-bottom,0px))}
.status{display:none}
/* Any screen wider than the phone gets a grey desk so the phone edge is visible */
@media (min-width:429px){
  html,body{background:var(--desk)}
  .phone{box-shadow:0 0 0 1px rgba(17,18,20,.06),0 20px 60px rgba(17,18,20,.14)}
}
@media (min-width:460px){
  body{padding:16px 0}
  .phone{border-radius:32px}
}
@media (min-width:600px){
  body{padding:32px 0}
  .phone{box-shadow:0 30px 80px rgba(17,18,20,.18)}
  .status{display:flex;height:41px;align-items:center;justify-content:space-between;padding:12px 24px;position:relative;z-index:2}
  .status p{font:600 14px Inter,system-ui,sans-serif;color:#272727}
  .status .dev{display:flex;gap:5px;align-items:center}
}

.mapfade{position:absolute;left:0;top:0;width:100%;height:359px;overflow:hidden;pointer-events:none;
  -webkit-mask-image:radial-gradient(205px 225px at 50% -45px,#000 0%,transparent 100%);
          mask-image:radial-gradient(205px 225px at 50% -45px,#000 0%,transparent 100%)}
.mapfade img{position:absolute;transform:translateX(-50%);object-fit:cover;max-width:none}
.mapfade img:nth-child(1){left:calc(50% + 30px);top:-98px;width:884px;height:529px}
.mapfade img:nth-child(2){left:calc(50% + 13px);top:212px;width:892px;height:453px}

.content{position:relative;z-index:1;display:flex;flex-direction:column;gap:40px}
.top{display:flex;flex-direction:column;gap:12px;padding-top:max(12px, env(safe-area-inset-top))}
@media (min-width:600px){.top{padding-top:0}}
.header{display:flex;align-items:center;justify-content:space-between;padding:0 16px}
.logo{width:147.6px;height:40px;position:relative;overflow:hidden}
.logo img{position:absolute;height:207.73%;width:112.56%;left:-7.04%;top:-53.16%;max-width:none}
.actions{display:flex;gap:12px;align-items:center}
.aiBtn{width:40px;height:40px;border-radius:32px;display:grid;place-items:center;
  background:rgba(255,255,255,.1);box-shadow:0 1px 8px rgba(0,0,0,.1)}
.aiBtn.glass::after{box-shadow:inset 1px 1px .5px -.4px rgba(255,255,255,.9), inset -1px -1px .5px -.4px rgba(255,255,255,.5)}
/* gradient hairline, as in Figma: dark at the top-left, clear in the middle, dark again at the bottom-right */
.ring::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:.45px;pointer-events:none;z-index:2;
  background:linear-gradient(145deg,rgba(26,26,26,.9) -24%,rgba(23,23,23,0) 50%,rgba(23,23,23,.7) 124%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.aiBtn span{width:23.5px;height:24px;position:relative;overflow:hidden;display:block}
.aiBtn img{position:absolute;height:131.17%;width:133.83%;left:-17.93%;top:-16.32%;max-width:none}
.me{width:40px;height:40px;border-radius:50%;object-fit:cover}

.sections{display:flex;flex-direction:column;gap:40px}
h1{font-weight:800;font-size:28px;letter-spacing:-1px;text-align:center;line-height:1.3;font-variation-settings:"opsz" 14}
.secHead{display:flex;align-items:center;justify-content:space-between;padding:8px 20px}
.secHead h2{font-weight:700;font-size:20px;line-height:22px;letter-spacing:-1px;font-variation-settings:"opsz" 14}
.secHead a{font-weight:500;font-size:16px;line-height:17px;letter-spacing:-.2px;color:var(--accent);text-decoration:none}

/* ---------- Liquid Glass, matched to the Figma Glass effect ----------
   No border, no fill on the save button, white 10% on chips.
   Light at -45deg gives a bright top-left rim and a softer bottom-right rim.
   Refraction bends the backdrop at the edges (Chromium); Safari gets a clear glass fallback. */
.glass{position:relative;isolation:isolate;
  -webkit-backdrop-filter:saturate(1.5) brightness(1.06);
          backdrop-filter:url(#lg) saturate(1.5) brightness(1.06)}
.glass.disperse{backdrop-filter:url(#lgd) saturate(1.6) brightness(1.08)}
.glass.strong{backdrop-filter:url(#lgs) saturate(1.7) brightness(1.08)}
@supports (-webkit-hyphens:none){ .glass,.glass.disperse,.glass.strong{backdrop-filter:blur(.6px) saturate(1.6) brightness(1.08)} }
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  box-shadow:inset 1px 1px .5px -.4px rgba(255,255,255,.8), inset -1px -1px .5px -.4px rgba(255,255,255,.4), inset 0 0 5px rgba(255,255,255,.06)}

/* ---------- Reel card ----------
   .slot positions and casts the shadow, .frame draws the optional border, .reel clips to an iOS squircle. */
.slot{position:absolute;will-change:transform}
.frame{position:absolute;inset:0;background:transparent}
.reel{position:absolute;inset:0;overflow:hidden;background:#2a2326;color:var(--on-dark)}
.reel video,.reel .poster{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.reel .poster{z-index:0}
.reel video{z-index:1;opacity:0;transition:opacity .35s}
.reel video.ready{opacity:1}
.reel .topShade{position:absolute;left:0;right:0;top:0;height:57px;z-index:2;pointer-events:none;background:linear-gradient(rgba(0,0,0,.8),rgba(0,0,0,0))}
.creator{position:absolute;z-index:3;display:flex;align-items:center;gap:8px;left:12px;top:12px;overflow:hidden}
.creator img{width:32px;height:32px;border-radius:50%;object-fit:cover;background:#fac799}
.creator span{font-weight:500;font-size:13px;line-height:17px;letter-spacing:-.2px;white-space:nowrap}
.save{position:absolute;z-index:3;right:12px;top:12px;width:40px;height:40px;border-radius:20px;display:grid;place-items:center;transition:transform .2s}
.save img{width:20px;height:20px;transition:filter .2s}
.save[aria-pressed="true"]{background:rgba(255,255,255,.92)}
.save[aria-pressed="true"] img{filter:invert(1)}
.save:active{transform:scale(.92)}
.bandBlur{position:absolute;z-index:3;left:0;right:0;bottom:0;height:110px;pointer-events:none;
  -webkit-backdrop-filter:blur(15px);backdrop-filter:blur(15px);
  -webkit-mask-image:linear-gradient(to bottom,transparent 0%,#000 32%);mask-image:linear-gradient(to bottom,transparent 0%,#000 32%)}
.info{position:absolute;z-index:4;left:0;right:0;bottom:0;display:flex;flex-direction:column;justify-content:flex-end;gap:10px;padding:24px 16px 12px;
  background:linear-gradient(0deg,rgba(0,0,0,.8),rgba(0,0,0,0))}
.info h3{font-family:var(--display);font-weight:700;font-size:22px;line-height:28px;letter-spacing:-1px}
.meta{display:flex;align-items:center;justify-content:space-between}
.chips{display:flex;gap:12px}
.chip{display:flex;align-items:center;gap:4px;padding:4px 10px 4px 8px;border-radius:999px;background:rgba(255,255,255,.1)}
.chip img{width:13px;height:13px}
.chip span,.views span{font-weight:500;font-size:12px;line-height:15px;letter-spacing:-.2px;white-space:nowrap}
.views{display:flex;align-items:center;gap:4px}
.views img{width:14px;height:14px}

/* ---------- Trending carousel ---------- */
.carousel{position:relative;height:375px;width:100%;touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:grab}
.carousel.dragging{cursor:grabbing}
.carousel .slot{left:50%;top:0;width:300px;height:375px;margin-left:-150px;transform-origin:50% 50%}
.carousel .slot.near{filter:drop-shadow(0 0 20px rgba(0,0,0,.1))}

/* ---------- Cafe row ---------- */
.row{display:flex;gap:12px;padding:0 20px 4px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding:0 20px;scrollbar-width:none;-webkit-overflow-scrolling:touch;scroll-behavior:smooth}
.row::-webkit-scrollbar{display:none}
.row .slot{position:relative;flex:none;width:168px;height:268px;scroll-snap-align:start}
.row .creator{left:8px;top:8px}
.row .creator img{width:24px;height:24px}
.row .creator span{font-size:12px;line-height:15px;width:96px;overflow:hidden;text-overflow:ellipsis}
.row .save{left:128px;right:auto;top:8px;width:32px;height:32px;border-radius:20px}
.row .save img{width:16px;height:16px}
.row .info{padding:24px 8px 12px}
.row .info h3{font-family:var(--sans);font-size:16px;line-height:1.3;letter-spacing:-.2px}
.row .chips{gap:6px}
.row .chip{padding:4px 6px}

/* ---------- Club deck ---------- */
.deckWrap{padding:0 20px;height:500px}
.deck{position:relative;width:388px;height:410px;touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:pointer;transform-origin:left top}
.deck .slot{will-change:left,top,width,height,transform,opacity}
.deck .reel{inset:2px}
.hint{display:block;text-align:center;font-size:12px;color:#6b6f76;margin-top:16px;letter-spacing:-.2px}
@media (max-width:427px){ .deck{transform:scale(calc((100vw - 40px) / 388px))} .deckWrap{height:calc(500px * (100vw - 40px) / 388px)} }

@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---------- Bottom navigation, as in the "Home Small Viewport" frame ---------- */
.navWrap{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:428px;z-index:50;pointer-events:none;
  height:calc(111px + env(safe-area-inset-bottom,0px));
  background:linear-gradient(to bottom,rgba(255,255,255,0) 12.9%,#fff 91.3%);
  -webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);
  -webkit-mask-image:linear-gradient(to bottom,transparent 0%,#000 35%);mask-image:linear-gradient(to bottom,transparent 0%,#000 35%)}
.tabbar{position:absolute;left:0;right:0;bottom:env(safe-area-inset-bottom,0px);height:96px;display:flex;gap:10px;align-items:flex-start;padding:8px 20px 0;pointer-events:auto}
.capsule{flex:1;min-width:0;height:64px;display:flex;align-items:center;justify-content:space-between;padding:6px;border-radius:32px;
  background:rgba(196,196,196,.28);border:1px solid rgba(255,255,255,.9)}
.tab{flex:1;min-width:0;height:52px;border-radius:26px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transition:background .25s}
.tab img{width:24px;height:24px}
.tab span{font-size:11px;font-weight:500;color:#333;font-variation-settings:"opsz" 14}
.tab[aria-current="page"]{background:rgba(255,255,255,.6)}
.tab[aria-current="page"] span{font-weight:700;color:#6b2bf5}
.tab:active{transform:scale(.96)}
.aiTab{position:relative;width:64px;height:64px;flex:none}
.aiTab .glow{position:absolute;left:-7px;top:-7px;width:78px;height:78px;pointer-events:none}
.aiTab .disc{position:absolute;inset:0;border-radius:32px;background:rgba(255,255,255,.6);display:grid;place-items:center}
.aiTab .disc img{width:28px;height:28px}
.toast{position:fixed;left:50%;bottom:calc(120px + env(safe-area-inset-bottom,0px));transform:translate(-50%,8px);opacity:0;z-index:60;
  background:rgba(17,18,20,.86);color:#fff;font-size:13px;font-weight:500;padding:10px 14px;border-radius:999px;transition:opacity .25s,transform .25s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- Full reel viewer (Figma "Full Reel") ---------- */
.viewer{position:fixed;top:0;left:50%;transform:translateX(-50%);width:100%;max-width:428px;height:100vh;height:100dvh;z-index:100;background:#000;overflow:hidden}
.viewer[hidden]{display:none}
.vScroll{position:absolute;inset:0;overflow-y:auto;scroll-snap-type:y mandatory;overscroll-behavior:contain;scrollbar-width:none}
.vScroll::-webkit-scrollbar{display:none}
.full{position:relative;height:100vh;height:100dvh;scroll-snap-align:start;scroll-snap-stop:always;overflow:hidden;background:#111;color:#fff}
.full video,.full .poster{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.full video{opacity:0;transition:opacity .3s}
.full video.ready{opacity:1}
.full .topShade{position:absolute;left:0;right:0;top:0;height:calc(97px + env(safe-area-inset-top,0px));background:linear-gradient(rgba(0,0,0,.8),rgba(0,0,0,0));pointer-events:none}
.backBtn{position:absolute;z-index:5;left:16px;top:calc(env(safe-area-inset-top,0px) + 16px);width:48px;height:48px;border-radius:50%;display:grid;place-items:center;
  background:rgba(36,36,36,.35)}
.backBtn img{width:24px;height:24px}
.full .bandBlur{height:auto;top:auto}
.fInfo{position:absolute;z-index:4;left:0;right:0;bottom:0;display:flex;flex-direction:column;gap:24px;padding:24px 16px calc(32px + env(safe-area-inset-bottom,0px));
  background:linear-gradient(0deg,rgba(0,0,0,.8),rgba(0,0,0,0))}
.fTop{display:flex;flex-direction:column;gap:16px}
.fMeta{display:flex;flex-direction:column;gap:10px}
.fInfo .creator{position:static}
.fInfo h3{font-family:var(--display);font-weight:700;font-size:22px;line-height:28px;letter-spacing:-1px}
.fRow{display:flex;align-items:center;gap:12px}
.fRow .chip span,.fRow .views span{font-size:14px}
.progress{position:relative;height:4px;border-radius:50px;background:rgba(245,245,245,.2);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);overflow:hidden}
.progress i{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:50px;background:#f5f5f5}
.fActions{display:flex;gap:16px}
.fSave{width:80px;flex:none;border-radius:46px;display:grid;place-items:center;padding:16px 19px;background:rgba(255,255,255,.2)}
.fSave img{width:24px;height:24px}
.fSave[aria-pressed="true"]{background:rgba(255,255,255,.92)}
.fSave[aria-pressed="true"] img{filter:invert(1)}
.fCta{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;gap:4px;padding:16px 19px;border-radius:46px;background:rgba(255,255,255,.2);
  font-weight:800;font-size:22px;line-height:28px;letter-spacing:-1px;color:#fff;font-variation-settings:"opsz" 14;white-space:nowrap}
.fCta img{width:24px;height:24px}
.fCta:active,.fSave:active,.backBtn:active{transform:scale(.96)}
.soundTip{position:absolute;z-index:6;left:50%;top:50%;transform:translate(-50%,-50%) scale(.9);opacity:0;padding:10px 14px;border-radius:999px;background:rgba(0,0,0,.55);font-size:13px;font-weight:600;transition:opacity .2s,transform .2s;pointer-events:none}
.soundTip.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
body.locked{overflow:hidden}

/* ---------- Live poll card (Figma "Poll Live") ---------- */
/* Sits between the header and Trending. Collapsed it takes no space; the negative margins cancel the section gaps. */
.pollSlot{display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:0fr;transition:grid-template-rows .55s cubic-bezier(.2,.9,.25,1);margin:-40px 0 -40px}
.pollSlot[hidden]{display:none}
.pollSlot.on{grid-template-rows:1fr}
.pollSlot>div{min-height:0;min-width:0;overflow:hidden}
.pollCard,.pollBox,.pollHead{min-width:0;max-width:100%}
.pollSlot.settled>div{overflow:visible}
.pollPad{padding:24px 16px 40px}
.pollCard{position:relative;filter:drop-shadow(0 1px 40px rgba(0,0,0,.12));opacity:0;transform:translateY(-12px) scale(.96);transition:opacity .45s .1s,transform .6s .1s cubic-bezier(.2,.9,.25,1.15)}
.pollSlot.on .pollCard{opacity:1;transform:none}
.pollBox{position:relative;background:#fff;display:flex;flex-direction:column;gap:24px;align-items:center;padding:4px 4px 12px}
.pollEdge{position:absolute;inset:0;background:#d9d9d9;pointer-events:none}
.pollHead{position:relative;width:100%;background:#f8f5ff;padding:12px 16px;display:flex;flex-direction:column;gap:8px;overflow:hidden;min-height:76px;justify-content:center}
.pollMeta{display:flex;align-items:center;gap:8px}
.pollMeta b{font-weight:800;font-size:12px;letter-spacing:.72px;text-transform:uppercase;color:var(--accent);font-variation-settings:"opsz" 14}
.pollMeta i{width:3px;height:3px;border-radius:50%;background:#c4c4c4}
.pollMeta span{font-size:14px;font-weight:400;letter-spacing:-.028px;color:#f74e78;transition:color .3s;font-variation-settings:"opsz" 14}
.pollMeta span.done{color:#1e9e5a}
.pollQ{overflow-wrap:anywhere;word-break:break-word;min-width:0;font-weight:600;font-size:18px;letter-spacing:-.2px;line-height:1.25;padding-right:64px;font-variation-settings:"opsz" 14;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.poll3d{position:absolute;right:-16.4px;top:3.3px;width:95.7px;height:95.7px;display:grid;place-items:center;pointer-events:none}
.poll3d span,.sheetArt span{display:block;position:relative;overflow:hidden;transform:rotate(25deg)}
.poll3d span{width:72px;height:72px}
.poll3d img,.sheetArt img{position:absolute;left:-17.57%;top:-16.32%;width:131.17%;height:131.17%;max-width:none}
.track{position:relative;width:calc(100% - 28px);max-width:364px;height:98px;touch-action:pan-y;transition:height .3s}
.bar{position:absolute;left:8px;right:0;top:39.5px;height:4px;border-radius:50px;background:#f5f5f5}
.bar .fill{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:50px;background:var(--accent);opacity:.9}
.dot{position:absolute;top:35.5px;width:12px;height:12px;margin-left:-6px;border-radius:50px;background:#f5f5f5;transition:background .25s,transform .25s}
.dot.mine{background:var(--accent)}
.opt{position:absolute;top:55.5px;transform:translateX(-50%);font-weight:700;font-size:20px;letter-spacing:-1px;line-height:1.3;text-align:center;white-space:normal;width:max-content;overflow-wrap:normal;color:var(--text-primary);font-variation-settings:"opsz" 14;padding:0 4px;border-radius:8px;transition:color .2s}
.opt em{display:block;font-style:normal;font-size:16px;line-height:1.2;letter-spacing:0}
.opt.mine{color:var(--accent)}
.track.many .opt{font-size:16px;letter-spacing:-.6px}
.voters{position:absolute;top:-.5px;height:24px;display:flex;transform:translateX(-50%)}
.voters img{width:24px;height:24px;border-radius:50%;border:1px solid #fff;object-fit:cover;margin-left:-8.57px;background:#eee;animation:pop .45s cubic-bezier(.2,.9,.3,1.4) both}
.voters img:first-child{margin-left:0}
@keyframes pop{from{transform:scale(0) translateY(10px);opacity:0}}
.meDot{position:absolute;top:25.5px;left:0;width:32px;height:32px;margin-left:-16px;border-radius:50%;overflow:hidden;cursor:grab;touch-action:none;z-index:2;
  box-shadow:0 0 0 2px #fff,0 2px 8px rgba(0,0,0,.18);transition:left .5s cubic-bezier(.2,.9,.25,1.2)}
.meDot.drag{transition:none;cursor:grabbing;transform:scale(1.12)}
.meDot img{width:100%;height:100%;object-fit:cover}
.meDot::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid var(--accent);opacity:0;animation:nudge 2.4s 1.2s ease-out infinite}
.meDot.voted::after{display:none}
@keyframes nudge{0%{transform:scale(.8);opacity:.7}70%,100%{transform:scale(1.25);opacity:0}}

/* ---------- Create a Poll sheet (Figma "Add a poll" / "Poll Value Added") ---------- */
.scrim{position:fixed;inset:0;z-index:120;background:rgba(0,0,0,.7);opacity:0;transition:opacity .35s}
.scrim.show{opacity:1}
.sheet{position:fixed;z-index:121;left:50%;bottom:8px;width:min(412px,calc(100vw - 16px));height:auto;max-height:calc(100dvh - 28px);transform:translate(-50%,calc(100% + 40px));
  transition:transform .5s cubic-bezier(.2,.9,.25,1),height .3s,bottom .25s;display:flex;flex-direction:column}
.sheet.show{transform:translate(-50%,0)}
.sheet.drag{transition:none}
.sheet[hidden],.scrim[hidden]{display:none}
.sheetBg{position:absolute;inset:0;background:#fff;pointer-events:none}
.sheetEdge{position:absolute;inset:0;background:#efefef;pointer-events:none}
.grab{position:relative;height:40px;flex:none;cursor:grab;touch-action:none}
.grab::before{content:"";position:absolute;left:50%;top:8px;width:80px;height:6px;margin-left:-40px;border-radius:3px;background:#ececec}
.sheetClip{position:absolute;inset:0;pointer-events:none;z-index:2}
.sheetArt{position:absolute;right:-8px;top:-18px;width:96px;height:96px;display:grid;place-items:center;filter:drop-shadow(0 8px 16px rgba(240,60,40,.25))}
.sheetArt span{width:80px;height:80px;transform:rotate(20deg)}
.sheetBody{position:relative;flex:1;min-height:0;overflow-y:auto;padding:0 24px 16px;display:flex;flex-direction:column;gap:40px;scrollbar-width:none}
.sheetBody::-webkit-scrollbar{display:none}

.opts{display:flex;flex-direction:column;gap:12px}
.optRow{position:relative;transition:opacity .25s,transform .3s}
.optRow.enter{opacity:0;transform:translateY(-8px)}

/* ---------- iOS continuous corners (Figma corner smoothing 60%) ---------- */
function squircle(w, h, r, s = 0.6, ox = 0, oy = 0){
  const budget = Math.min(w, h) / 2; r = Math.min(r, budget);
  let p = (1 + s) * r; const maxS = budget / r - 1; s = Math.max(0, Math.min(s, maxS)); p = Math.min(p, budget);
  const rad = x => x * Math.PI / 180;
  const arcMeasure = 90 * (1 - s);
  const arc = Math.sin(rad(arcMeasure / 2)) * r * Math.SQRT2;
  const alpha = (90 - arcMeasure) / 2;
  const p34 = r * Math.tan(rad(alpha / 2));
  const beta = 45 * s;
  const c = p34 * Math.cos(rad(beta)), d = c * Math.tan(rad(beta));
  const b = (p - arc - c - d) / 3, a = 2 * b;
  const f = n => +n.toFixed(3);
  const A=f(a), AB=f(a+b), ABC=f(a+b+c), BC=f(b+c), C=f(c), D=f(d), R=f(r), K=f(arc), P=f(p), W=f(w), H=f(h);
  const X = v => f(v + ox), Y = v => f(v + oy);
  return `M ${X(W-P)} ${Y(0)} c ${A} 0 ${AB} 0 ${ABC} ${D} a ${R} ${R} 0 0 1 ${K} ${K} c ${D} ${C} ${D} ${BC} ${D} ${ABC} `+
         `L ${X(W)} ${Y(H-P)} c 0 ${A} 0 ${AB} ${-D} ${ABC} a ${R} ${R} 0 0 1 ${-K} ${K} c ${-C} ${D} ${-BC} ${D} ${-ABC} ${D} `+
         `L ${X(P)} ${Y(H)} c ${-A} 0 ${-AB} 0 ${-ABC} ${-D} a ${R} ${R} 0 0 1 ${-K} ${-K} c ${-D} ${-C} ${-D} ${-BC} ${-D} ${-ABC} `+
         `L ${X(0)} ${Y(P)} c 0 ${-A} 0 ${-AB} ${D} ${-ABC} a ${R} ${R} 0 0 1 ${K} ${-K} c ${C} ${-D} ${BC} ${-D} ${ABC} ${-D} Z`;
}
const ring = (el, w, h, r, t = 1) => { const d = squircle(w, h, r) + " " + squircle(w - 2*t, h - 2*t, Math.max(0, r - t), .6, t, t); el.style.clipPath = `path(evenodd, '${d}')`; el.style.webkitClipPath = el.style.clipPath; };
const clip = (el, w, h, r) => { el.style.clipPath = `path('${squircle(w, h, r)}')`; el.style.webkitClipPath = el.style.clipPath; };

/* ---------- Glass refraction map: flat in the middle, bends near the edges ---------- */
(function(){
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><defs>
    <linearGradient id="x"><stop offset="0" stop-color="#000"/><stop offset=".16" stop-color="#800000"/><stop offset=".84" stop-color="#800000"/><stop offset="1" stop-color="#f00"/></linearGradient>
    <linearGradient id="y" x2="0" y2="1"><stop offset="0" stop-color="#000"/><stop offset=".3" stop-color="#008000"/><stop offset=".7" stop-color="#008000"/><stop offset="1" stop-color="#0f0"/></linearGradient>
    </defs><rect width="100" height="100" fill="url(#x)"/><rect width="100" height="100" fill="url(#y)" style="mix-blend-mode:screen"/></svg>`;
  const url = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
  for (const id of ["lgMap","lgdMap","lgsMap"]){ const n = document.getElementById(id); n.setAttribute("href", url); n.setAttributeNS("http://www.w3.org/1999/xlink","href", url); }
})();

/* ---------- Card ---------- */
function card(x){
  const slot = document.createElement("article"); slot.className = "slot";
  slot.innerHTML = `
    <div class="frame"></div>
    <div class="reel">
      <img class="poster" src="posters/${x.v}.jpg" alt="">
      <video muted loop playsinline preload="none" data-src="clips/${x.v}.mp4"></video>
      <div class="topShade"></div>
      <div class="creator"><img src="${x.p}" alt="" loading="lazy" onerror="this.src='assets/creator-avatar.svg'"><span>${x.h}</span></div>
      <button class="save glass" aria-label="Save reel" aria-pressed="false"><img src="assets/bookmark.svg" alt=""></button>
      <div class="bandBlur"></div>
      <div class="info">
        <h3>${x.t}</h3>
        <div class="meta">
          <div class="chips">
            <div class="chip glass disperse"><img src="assets/calendar.svg" alt=""><span>${x.d}</span></div>
            <div class="chip glass disperse"><img src="assets/pin.svg" alt=""><span>${x.s}</span></div>
          </div>
          <div class="views"><img src="assets/play.svg" alt=""><span>${x.w}</span></div>
        </div>
      </div>
    </div>`;
  const save = slot.querySelector(".save");
  save.addEventListener("pointerdown", e => e.stopPropagation());
  save.addEventListener("click", e => { e.stopPropagation(); save.setAttribute("aria-pressed", save.getAttribute("aria-pressed") === "true" ? "false" : "true"); });
  const v = slot.querySelector("video");
  v.addEventListener("playing", () => v.classList.add("ready"));
  const info = slot.querySelector(".info"), band = slot.querySelector(".bandBlur");
  new ResizeObserver(() => { band.style.height = (info.offsetHeight + 10) + "px"; }).observe(info);
  slot._data = x;
  return slot;
}
function play(slot){ const v = slot.querySelector("video"); if (!v.src) v.src = v.dataset.src; v.play().catch(()=>{}); }
function pause(slot){ const v = slot.querySelector("video"); if (v.src) v.pause(); }

/* ---------- Trending: drag-follow carousel with spring snapping, endless both ways ---------- */
const car = document.getElementById("carousel");
const tSlots = TRENDING.map(x => { const s = card(x); car.appendChild(s); clip(s.querySelector(".reel"), 300, 375, 30); return s; });
const N = tSlots.length, GAP = 230;
let pos = 0, vel = 0, target = 0, raf = 0, dragging = false, playing = -1;
const wrap = d => { d = ((d % N) + N) % N; return d > N / 2 ? d - N : d; };
function render(){
  for (let i = 0; i < N; i++){
    const s = tSlots[i], d = wrap(i - pos), a = Math.abs(d), sg = Math.sign(d) || 1, u = Math.min(1, Math.max(0, (a - .3) / .7)), t = u * u * (3 - 2 * u);
    const x = sg * (a <= 1 ? GAP * a : GAP + (a - 1) * 46);
    const sc = a <= 1 ? 1 - .2 * a : Math.max(.6, .8 - (a - 1) * .08);
    const op = a <= 1 ? 1 - .2 * t : Math.max(0, .8 - (a - 1) * 1.1);
    s.style.transform = `translate3d(${x.toFixed(2)}px,0,0) scale(${sc.toFixed(4)})`;
    s.style.opacity = op.toFixed(3);
    s.style.zIndex = String(100 - Math.round(a * 10));
    s.style.visibility = op <= 0.01 ? "hidden" : "visible";
    s.classList.toggle("near", a < 1.2);
    const reel = s.children[1];
    const m = d >= 0
      ? `linear-gradient(to right, rgba(0,0,0,${(1-.22*t).toFixed(3)}) 0%, rgba(0,0,0,${(1-t).toFixed(3)}) 53%)`
      : `linear-gradient(to right, rgba(0,0,0,${(1-t).toFixed(3)}) 50%, rgba(0,0,0,${(1-.28*t).toFixed(3)}) 100%)`;
    reel.style.webkitMaskImage = reel.style.maskImage = t < .001 ? "none" : m;
  }
  const c = ((Math.round(pos) % N) + N) % N;
  if (c !== playing && !dragging){ if (playing >= 0) pause(tSlots[playing]); playing = c; play(tSlots[c]); }
}
function animate(){
  cancelAnimationFrame(raf);
  let last = performance.now();
  const step = now => {
    const dt = Math.min(.032, (now - last) / 1000); last = now;

const deck = document.getElementById("deck");
const SLOT = [ // left, top, width, height, radius, border, border colour (grey -> white), shadow alpha
  [0, 0, 328, 500, 30, 2, 244, .10],
  [58, 16, 302, 468, 27.66, 2, 255, 0],

function addOption(focus){
  const n = optsEl.children.length; if (n >= MAX_OPTS) return;
  const row = document.createElement("div"); row.className = "optRow" + (n >= 2 ? " enter" : "");
  row.innerHTML = `<input type="text" placeholder="Option ${n + 1}" aria-label="Option ${n + 1}" data-sq="16" enterkeyhint="next">` +
    (n >= 2 ? `<button type="button" class="x" aria-label="Remove option">${X_ICON}</button>` : "") + `<p class="err" role="alert"></p>`;
  optsEl.appendChild(row); watchSq(row);
  requestAnimationFrame(() => row.classList.remove("enter"));
  if (focus) row.querySelector("input").focus();
  syncSheet();
}
function renumber(){ [...optsEl.children].forEach((r, i) => { const inp = r.querySelector("input"); inp.placeholder = "Option " + (i + 1); inp.setAttribute("aria-label", "Option " + (i + 1)); }); }
function syncSheet(){
  const filled = [...optsEl.querySelectorAll("input")].filter(i => i.value.trim()).length;
  createBtn.disabled = !(qEl.value.trim() && filled >= 2);
  qWrap.classList.toggle("filled", !!qEl.value.trim());
  addMore.hidden = optsEl.children.length >= MAX_OPTS;
  fitSheet();
}
function growQ(){ qEl.style.height = "auto"; qEl.style.height = qEl.scrollHeight + "px"; }

// The sheet hugs its content, so adding Option 3 or a second line grows it upward
function maxSheetH(){ const vv = window.visualViewport, kb = vv ? Math.max(0, innerHeight - vv.height - vv.offsetTop) : 0;
  return kb > 0 ? vv.height - 20 : innerHeight - 28; }
function fitSheet(instant){
  if (sheet.hidden) return;
  const prev = sheet.offsetHeight;
  sheet.style.height = "auto"; sheetBody.style.flex = "none";
  const nat = sheet.offsetHeight;
  sheetBody.style.flex = "";
  const next = Math.min(nat, maxSheetH());
  if (instant || !prev){ sheet.style.height = next + "px"; return; }
  sheet.style.height = prev + "px"; void sheet.offsetHeight;
  sheet.style.height = next + "px";
}

// Block anything past the limit and say why
function check(el, isQ){
  // flags and emoji at the end don't count toward the limit, even half-typed ones
  const v = el.value, name = isQ ? v : v.replace(/[\s\p{Regional_Indicator}\p{Extended_Pictographic}\uFE0F\u200D]+$/u, "");
  if ([...name.trim()].length > (isQ ? Q_MAX : OPT_MAX)) return `Max ${isQ ? Q_MAX : OPT_MAX} characters`;
  if (!isQ && name.trim().split(/\s+/).filter(Boolean).length > OPT_WORDS) return `Keep it to ${OPT_WORDS} words`;
  return null;
}
function flag(box, el, msg){
  const err = box.querySelector(".err");
  if (msg){
    err.textContent = msg; box.classList.add("bad");
    el.classList.remove("shake"); void el.offsetWidth; el.classList.add("shake");
    if (navigator.vibrate) navigator.vibrate(15);
    clearTimeout(box._t); box._t = setTimeout(() => { box.classList.remove("bad"); fitSheet(); }, 2600);
  } else box.classList.remove("bad");
}
sheet.addEventListener("focusout", e => { const box = e.target.closest(".optRow,.qWrap"); if (box && box.classList.contains("bad")){ box.classList.remove("bad"); fitSheet(); } });
function guard(el, isQ, box){
  const msg = check(el, isQ);
  if (msg){ const pos = Math.max(0, (el.selectionStart || 0) - (el.value.length - (el._last || "").length)); el.value = el._last || ""; try { el.setSelectionRange(pos, pos); } catch(e){} }
  else el._last = el.value;
  flag(box, el, msg);
}

function openPoll(){
  qEl.value = ""; qEl._last = ""; qWrap.classList.remove("bad"); optsEl.innerHTML = "";
  sheet.style.transform = ""; sheet.style.height = "";
  scrim.hidden = false; sheet.hidden = false;
  addOption(); addOption(); growQ(); fitSheet(true);
  requestAnimationFrame(() => requestAnimationFrame(() => { scrim.classList.add("show"); sheet.classList.add("show"); }));
  document.body.classList.add("locked");
  history.pushState({poll: true}, "", "#poll");
}
function closePoll(fromPop){
  if (sheet.hidden) return;
  document.activeElement && document.activeElement.blur && document.activeElement.blur();
  sheet.style.transform = ""; scrim.classList.remove("show"); sheet.classList.remove("show", "typing");
  setTimeout(() => { if (!sheet.classList.contains("show")) { sheet.hidden = true; scrim.hidden = true; } }, 500);
  if (viewer.hidden) document.body.classList.remove("locked");
  if (!fromPop && location.hash === "#poll") history.back();
}
document.getElementById("pollBtn").addEventListener("click", openPoll);
scrim.addEventListener("click", () => closePoll());
window.addEventListener("popstate", () => closePoll(true));
document.addEventListener("keydown", e => { if (e.key === "Escape") closePoll(); });

qEl.addEventListener("input", () => { guard(qEl, true, qWrap); growQ(); syncSheet(); });
qEl.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); optsEl.querySelector("input").focus(); } });
optsEl.addEventListener("input", e => { if (e.target.matches("input")) guard(e.target, false, e.target.parentElement); syncSheet(); });
optsEl.addEventListener("keydown", e => {
  if (e.key !== "Enter" || !e.target.matches("input")) return;
  e.preventDefault();
  const inputs = [...optsEl.querySelectorAll("input")], i = inputs.indexOf(e.target);
  if (inputs[i + 1]) inputs[i + 1].focus(); else if (!createBtn.disabled) sheet.requestSubmit(); else if (inputs.length < MAX_OPTS) addOption(true);
});
optsEl.addEventListener("click", e => { const x = e.target.closest(".x"); if (!x) return; x.parentElement.remove(); renumber(); syncSheet(); });
addMore.addEventListener("click", () => addOption(true));
window.addEventListener("resize", () => fitSheet(true));

// The "typing" look from Figma: footer gets a hairline and the sheet rides above the keyboard
sheet.addEventListener("focusin", e => { if (e.target.matches("input,textarea")) sheet.classList.add("typing"); });
sheet.addEventListener("focusout", () => setTimeout(() => { if (!sheet.contains(document.activeElement) || !document.activeElement.matches("input,textarea")) sheet.classList.remove("typing"); }, 0));
if (window.visualViewport){
  const fit = () => { const vv = visualViewport, kb = Math.max(0, innerHeight - vv.height - vv.offsetTop);
    sheet.style.bottom = (kb + 8) + "px"; fitSheet(true); };
  visualViewport.addEventListener("resize", fit); visualViewport.addEventListener("scroll", fit);
}

// Pull the handle down to dismiss
document.getElementById("pollGrab").addEventListener("pointerdown", e => {
  const g = e.currentTarget; g.setPointerCapture(e.pointerId); sheet.classList.add("drag");
  const y0 = e.clientY, t0 = performance.now(); let dy = 0;
  const move = ev => { dy = Math.max(0, ev.clientY - y0); sheet.style.transform = `translate(-50%, ${dy}px)`; scrim.style.opacity = Math.max(0, 1 - dy / 400); };
  const up = ev => {
    g.removeEventListener("pointermove", move); g.removeEventListener("pointerup", up); g.removeEventListener("pointercancel", up);
    sheet.classList.remove("drag"); scrim.style.opacity = "";
    const v = dy / Math.max(1, performance.now() - t0);
    if (dy > 120 || (v > .6 && dy > 30)) closePoll(); else sheet.style.transform = "";
  };
  g.addEventListener("pointermove", move); g.addEventListener("pointerup", up); g.addEventListener("pointercancel", up);
});

sheet.addEventListener("submit", e => {
  e.preventDefault(); if (createBtn.disabled) return;
  const q = qEl.value.trim().replace(/\s+/g, " ");
  const labels = [...optsEl.querySelectorAll("input")].map(i => i.value.trim()).filter(Boolean);
  closePoll();
  window.scrollTo({top: 0, behavior: "smooth"});
  setTimeout(() => { showPoll(q, labels); say("Poll shared with your crew"); }, 280);
});
</script>
</body>
</html>
